dataConnectors:
  orderEvents:
    brokers: $orderEventsBrokers
    password: $orderEventsPassword
    saslMechanism: $orderEventsSaslMechanism
    securityProtocol: $orderEventsSecurityProtocol
    username: $orderEventsUsername
endpoints:
  analyticsOrders:
    enabled: $analyticsOrdersEnabled
  analyticsPayments:
    enabled: $analyticsPaymentsEnabled
  analyticsSchedule:
    enabled: $analyticsScheduleEnabled
    missedRunPolicy: $analyticsScheduleMissedRunPolicy
    overlapPolicy: $analyticsScheduleOverlapPolicy
    schedule: $analyticsScheduleSchedule
    timezone: $analyticsScheduleTimezone
    tracingEnabled: $analyticsScheduleTracingEnabled
  analyticsShipments:
    enabled: $analyticsShipmentsEnabled
  cycleAnalyticsInput:
    enabled: $cycleAnalyticsInputEnabled
  cycleAnalyticsResult:
    enabled: $cycleAnalyticsResultEnabled
  highValueAnalytics:
    enabled: $highValueAnalyticsEnabled
  joinedAnalytics:
    enabled: $joinedAnalyticsEnabled
  orderProcessed:
    enabled: $orderProcessedEnabled
  standardAnalytics:
    enabled: $standardAnalyticsEnabled
  substreamAnalyticsInput:
    enabled: $substreamAnalyticsInputEnabled
  substreamAnalyticsResult:
    enabled: $substreamAnalyticsResultEnabled
services:
  analyticsService:
    defaultGrpcTimeout: $analyticsServiceDefaultGrpcTimeout
    environment: $analyticsServiceEnvironment
    grpcHost: $analyticsServiceGrpcHost
    grpcPort: $analyticsServiceGrpcPort
    httpHost: $analyticsServiceHttpHost
    httpPort: $analyticsServiceHttpPort
