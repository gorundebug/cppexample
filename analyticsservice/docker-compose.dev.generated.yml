services:
  analyticsservice:
    image: analyticsservice-cpp-build
    working_dir: /workspace
    command:
      - /workspace/build/example_analytics_service
      - --config
      - /workspace/static_config.yaml
      - --config_vars
      - /workspace/config/config_vars.integration.yaml
    volumes:
      - .:/workspace
      - cpp-dev-cmake-build:/workspace/build
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE

volumes:
  cpp-dev-cmake-build:
    name: cppexample_cpp-cmake-build