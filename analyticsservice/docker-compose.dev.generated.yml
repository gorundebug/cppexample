services:
  analyticsservice:
    image: analyticsservice-cpp-build
    working_dir: /workspace/source
    command:
      - /bin/sh
      - -c
      - |
        if [ "$${DEBUG:-0}" = "1" ]; then
          exec gdbserver :2345 /workspace/build/example_analytics_service --config /workspace/source/static_config.yaml --config_vars /workspace/source/config/config_vars.integration.yaml
        fi
        exec /workspace/build/example_analytics_service --config /workspace/source/static_config.yaml --config_vars /workspace/source/config/config_vars.integration.yaml
    volumes:
      - .:/workspace/source:ro
      - cpp-dev-cmake-build:/workspace/build
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE

volumes:
  cpp-dev-cmake-build:
    name: cppexample_analyticsservice_cpp-cmake-build
    external: true