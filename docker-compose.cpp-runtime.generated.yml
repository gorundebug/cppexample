services:
  analyticsservice:
    image: cppexample-analyticsservice:local
    working_dir: /app
    command:
      - --config
      - /app/static_config.yaml
      - --config_vars
      - /app/config/config_vars.integration.yaml
    volumes: !reset []
    security_opt: !reset []
    cap_add: !reset []
    ports: !override
      - "${ANALYTICS_SERVICE_HOST_HTTP_PORT:-9093}:${ANALYTICS_SERVICE_HTTP_PORT:-9093}"
      - "${ANALYTICS_SERVICE_HOST_GRPC_PORT:-9203}:${ANALYTICS_SERVICE_GRPC_PORT:-9203}"
  inventoryservice:
    image: cppexample-inventoryservice:local
    working_dir: /app
    command:
      - --config
      - /app/static_config.yaml
      - --config_vars
      - /app/config/config_vars.integration.yaml
    volumes: !reset []
    security_opt: !reset []
    cap_add: !reset []
    ports: !override
      - "${INVENTORY_SERVICE_HOST_HTTP_PORT:-9092}:${INVENTORY_SERVICE_HTTP_PORT:-9092}"
      - "${INVENTORY_SERVICE_HOST_GRPC_PORT:-9202}:${INVENTORY_SERVICE_GRPC_PORT:-9202}"
  orderservice:
    image: cppexample-orderservice:local
    working_dir: /app
    command:
      - --config
      - /app/static_config.yaml
      - --config_vars
      - /app/config/config_vars.integration.yaml
    volumes: !reset []
    security_opt: !reset []
    cap_add: !reset []
    ports: !override
      - "${ORDER_SERVICE_HOST_HTTP_PORT:-9091}:${ORDER_SERVICE_HTTP_PORT:-9091}"
      - "${ORDER_SERVICE_HOST_GRPC_PORT:-9201}:${ORDER_SERVICE_GRPC_PORT:-9201}"