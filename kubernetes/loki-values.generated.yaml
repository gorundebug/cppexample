# Monolithic filesystem-backed Loki is intentionally local-only.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  useTestSchema: true
  limits_config:
    allow_structured_metadata: true

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 2Gi

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false