server:
  image:
    repository: temporalio/server
    tag: "1.31.2"
    pullPolicy: IfNotPresent
  replicaCount: 1
  metrics:
    annotations:
      enabled: true
    serviceMonitor:
      enabled: true
      interval: 15s
      additionalLabels:
        release: monitoring
  config:
    logLevel: info
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 4
      datastores:
        default:
          sql:
            createDatabase: true
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            connectAddr: temporal-postgresql:5432
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-postgresql
            secretKey: password
        visibility:
          sql:
            createDatabase: true
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal_visibility
            connectAddr: temporal-postgresql:5432
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-postgresql
            secretKey: password
    namespaces:
      create: true
      namespace:
        - name: default
          retention: 3d
  frontend:
    service:
      type: ClusterIP
      port: 7233

admintools:
  enabled: true
  image:
    repository: temporalio/admin-tools
    tag: "1.31.2"
    pullPolicy: IfNotPresent

web:
  enabled: true
  image:
    repository: temporalio/ui
    tag: "2.53.2"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080