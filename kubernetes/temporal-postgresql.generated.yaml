apiVersion: v1
kind: Service
metadata:
  name: temporal-postgresql
  labels:
    app.kubernetes.io/name: temporal-postgresql
    app.kubernetes.io/part-of: cppexample
spec:
  selector:
    app.kubernetes.io/name: temporal-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: temporal-postgresql
  labels:
    app.kubernetes.io/name: temporal-postgresql
    app.kubernetes.io/part-of: cppexample
spec:
  serviceName: temporal-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-postgresql
        app.kubernetes.io/part-of: cppexample
    spec:
      containers:
        - name: postgresql
          image: postgres:16.4-bookworm
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: temporal-postgresql
                  key: password
          ports:
            - name: postgresql
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "temporal"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "temporal"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi