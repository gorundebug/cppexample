dataConnectors:
  temporal:
    address: temporal:7233
    apiKey: ""
    identity: example-automation
    namespace: default
    tlsEnabled: false
    workerStopTimeout: 5000
endpoints:
  activityJob:
    activityHeartbeatTimeout: 5000
    activityStartToCloseTimeout: 30000
    enabled: true
    maxConcurrentActivities: 2
    maximumAttempts: 3
    missedRunPolicy: FireOnce
    overlapPolicy: Skip
    schedule: ""
    taskQueue: automation-activity-jobs
    timezone: UTC
    tracingEnabled: false
    workflowExecutionTimeout: 60000
  fanOutActivityA:
    activityHeartbeatTimeout: 5000
    activityStartToCloseTimeout: 30000
    enabled: true
    maxConcurrentActivities: 2
    maximumAttempts: 3
    missedRunPolicy: FireOnce
    overlapPolicy: Skip
    schedule: ""
    taskQueue: automation-activity-jobs
    timezone: UTC
    tracingEnabled: false
    workflowExecutionTimeout: 60000
  fanOutActivityB:
    activityHeartbeatTimeout: 5000
    activityStartToCloseTimeout: 30000
