                        Preserve the result returned through the on-demand Activity endpoint.
                    functionInitializerGroup: ""
                    functionModule: ""
                    functionName: ObserveActivityResult
                    functionPackage: ""
                    name: Observe Activity Result
                    source: submitActivityJob
                    type: Map
                    valueType: automationJob
                observeFanOutActivityB:
                    functionDescription: |
                        Observe the typed result returned by the Activity B fan-out branch.
                    functionInitializerGroup: ""
                    functionModule: ""
                    functionName: ObserveFanoutActivityB
                    functionPackage: ""
                    name: Observe Fan-Out Activity B
                    source: callFanOutActivityB
                    type: Map
                    valueType: automationJob
                observeFanOutActivityC:
                    functionDescription: |
                        Observe the typed result returned by the Activity C fan-out branch.
