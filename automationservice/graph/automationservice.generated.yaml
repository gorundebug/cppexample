                    name: Call Sequential Activity A
                    source: workflowPause
                    type: Sink
                    valueType: automationJob
                callSequentialActivityB:
                    endpoint: sequentialActivityB
                    name: Call Sequential Activity B
                    source: callSequentialActivityA
                    type: Sink
                    valueType: automationJob
                consumeActivityJob:
                    endpoint: activityJob
                    name: Consume Activity Job
                    source: processActivityJob
                    type: Input
                    valueType: automationJob
                consumeFanOutActivityA:
                    endpoint: fanOutActivityA
                    name: Consume Fan-Out Activity A
                    source: processFanOutActivityA
                    type: Input
                    valueType: automationJob
                consumeFanOutActivityB:
                    endpoint: fanOutActivityB
                    name: Consume Fan-Out Activity B
                    source: processFanOutActivityB
                    type: Input
                    valueType: automationJob
                consumeFanOutActivityC:
                    endpoint: fanOutActivityC
                    name: Consume Fan-Out Activity C
                    source: processFanOutActivityC
                    type: Input
                    valueType: automationJob
                consumeFanOutWorkflowJob:
                    endpoint: fanOutWorkflowJob
                    name: Consume Fan-Out Workflow Job
                    type: Input
                    valueType: automationJob
                consumeSequentialActivityA:
                    endpoint: sequentialActivityA
                    name: Consume Sequential Activity A
                    source: processSequentialActivityA
                    type: Input
                    valueType: automationJob
                consumeSequentialActivityB:
                    endpoint: sequentialActivityB
                    name: Consume Sequential Activity B
                    source: processSequentialActivityB
                    type: Input
                    valueType: automationJob
                consumeWorkflowJob:
                    endpoint: workflowJob
                    name: Consume Workflow Job
                    source: processWorkflowJob
                    type: Input
                    valueType: automationJob
                localSchedule:
