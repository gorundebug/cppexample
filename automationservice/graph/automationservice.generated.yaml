                    functionModule: ""
                    functionName: ProcessFanoutActivityA
                    functionPackage: ""
                    name: Process Fan-Out Activity A
                    source: consumeFanOutActivityA
                    type: Map
                    valueType: automationJob
                processFanOutActivityB:
                    functionDescription: |
                        Return Activity B's typed fan-out result.
