        environment: ""
        golangVersion: 1.25.4
        grpcHost: 0.0.0.0
        grpcPort: 9204
        httpHost: 0.0.0.0
        httpPort: 9094
        kubernetesWorkloadType: Deployment
        links:
            link1:
                callSemantics: FunctionCall
