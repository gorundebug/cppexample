dataConnectors:
    localCron:
        endpoints:
            localSchedule:
                enabled: true
                functionDescription: |
                    Create a job message identifying the local scheduled firing.
                functionName: LocalSchedule
                missedRunPolicy: FireOnce
                name: Local Schedule
                overlapPolicy: Skip
                schedule: '*/5 * * * *'
                timezone: UTC
        goImplementation: go/gocron
        name: Local Cron
        pythonImplementation: python/apscheduler
        rustImplementation: rust/croner
        type: Cron
        typeScriptImplementation: node/croner
    temporal:
        address: temporal:7233
        endpoints:
            durableJob:
                activityHeartbeatTimeout: 5000
                activityStartToCloseTimeout: 30000
                enabled: true
                maximumAttempts: 3
                name: Durable Job
                taskQueue: automation-jobs
                workflowExecutionTimeout: 60000
            temporalSchedule:
                activityHeartbeatTimeout: 5000
                activityStartToCloseTimeout: 30000
                enabled: true
                functionDescription: |
                    Create a job message identifying the durable scheduled firing.
                functionName: TemporalSchedule
                maximumAttempts: 3
                missedRunPolicy: FireOnce
                name: Temporal Schedule
                overlapPolicy: Skip
                schedule: '*/10 * * * *'
                scheduleId: example-automation-schedule
                taskQueue: automation-schedules
                timezone: UTC
                workflowExecutionTimeout: 60000
        goImplementation: temporal/go
        identity: example-automation
        maxConcurrentActivities: 2
        maxConcurrentWorkflows: 4
        name: Temporal
        namespace: default
        pythonImplementation: temporal/python
        type: Temporal
        typeScriptImplementation: temporal/typescript
services:
    automationService:
        color: '#00A86B'
        defaultCallSemantics: FunctionCall
        environment: ""
        golangVersion: 1.25.4
        grpcHost: 0.0.0.0
        grpcPort: 9204
        httpHost: 0.0.0.0
        httpPort: 9094
        kubernetesWorkloadType: Deployment
        links:
            link1:
                activityHeartbeatTimeout: 5000
                activityStartToCloseTimeout: 30000
                callSemantics: DurableCall
                dataConnector: temporal
                from: consumeDurableJob
                maximumAttempts: 3
                taskQueue: automation-durable-calls
                to: durablePause
                workflowExecutionTimeout: 60000
        livenessHandler: health/live
        metricsHandler: metrics
        modulePath: github.com/gorundebug/cppexample-automationservice
        name: Automation Service
        pipelines:
            automation:
                consumeDurableJob:
                    endpoint: durableJob
                    name: Consume Durable Job
                    source: processDurableJob
                    type: Input
                    valueType: string
                    xPos: -130
                    yPos: -330
                durablePause:
                    duration: 250
                    functionDescription: |
                        Suspend a DurableCall through a Temporal timer, then resume the pipeline without occupying an Activity slot.
                    functionInitializerGroup: ""
                    functionModule: ""
                    functionName: DurablePause
                    functionPackage: ""
                    name: Durable Pause
                    source: consumeDurableJob
                    type: Delay
                    xPos: 90
                    yPos: -330
                localSchedule:
                    endpoint: localSchedule
                    name: Local Schedule
                    type: Input
                    valueType: string
                    xPos: -1050
                    yPos: -480
                mergeJobSubmissions:
                    name: Merge Job Submissions
                    sources:
                        - localSchedule
                        - temporalSchedule
                    type: Merge
                    xPos: -570
                    yPos: -330
                processDurableJob:
                    functionDescription: |
                        Process one accepted automation job and return its result.
                    functionInitializerGroup: ""
                    functionModule: ""
                    functionName: ProcessDurableJob
                    functionPackage: ""
                    name: Process Durable Job
                    source: durablePause
                    type: Map
                    valueType: string
                    xPos: 330
                    yPos: -330
                submitDurableJob:
                    endpoint: durableJob
                    name: Submit Durable Job
                    source: mergeJobSubmissions
                    type: Sink
                    valueType: string
                    xPos: -360
                    yPos: -330
                temporalSchedule:
                    endpoint: temporalSchedule
                    name: Temporal Schedule
                    type: Input
                    valueType: string
                    xPos: -1050
                    yPos: -180
        programmingLanguage: GoLang
        readinessHandler: health/ready
        shutdownTimeout: 30000
        startupHandler: health/startup
        statusHandler: status
settings:
    moduleVersion: v0.2.12
    name: Example
    repoPath: github.com/gorundebug/cppexample
types:
    string:
        description: Automation job payload and result.
        publicType: false
        type: string
        useAlias: false
