                    type: Sink
                    valueType: automationJob
                submitWorkflowJob:
                    endpoint: workflowJob
                    name: Submit Workflow Job
                    source: splitOnDemandJobs
                    type: Sink
                    valueType: automationJob
                temporalActivitySchedule:
