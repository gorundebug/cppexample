services:
  cpp-build:
    image: cppexample-cpp-build:local
    build:
      context: .
      dockerfile: Dockerfile.cmake
      target: development
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        DEPENDENCY_DOCKER_REGISTRY: ${DEPENDENCY_DOCKER_REGISTRY:-docker.io}
        DEPENDENCY_GITHUB_RAW_URL: ${DEPENDENCY_GITHUB_RAW_URL:-}
        DEPENDENCY_APT_UBUNTU_ARCHIVE_URL: ${DEPENDENCY_APT_UBUNTU_ARCHIVE_URL:-}
        DEPENDENCY_APT_UBUNTU_SECURITY_URL: ${DEPENDENCY_APT_UBUNTU_SECURITY_URL:-}
        DEPENDENCY_APT_UBUNTU_PORTS_URL: ${DEPENDENCY_APT_UBUNTU_PORTS_URL:-}
        DEPENDENCY_CONAN_REMOTE_URL: ${DEPENDENCY_CONAN_REMOTE_URL:-}
        DEPENDENCY_CONAN_UPLOAD_URL: ${DEPENDENCY_CONAN_UPLOAD_URL:-}
        DEPENDENCY_CONAN_PUBLISH: ${DEPENDENCY_CONAN_PUBLISH:-0}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
      additional_contexts:
        servicelib-source: ${SERVICELIB_SOURCE_CONTEXT:-https://github.com/gorundebug/cppservicelib.git#v0.2.72}
        userver-source: ${USERVER_SOURCE_CONTEXT:-https://github.com/userver-framework/userver.git#c9f77729c0edce7e423def2d4a4450aa7fc9d259}
      secrets:
        - dependency_conan_credential
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /workspace/source
    environment:
      SERVICELIB_SOURCE_DIR: ${SERVICELIB_CONTAINER_SOURCE_DIR:-/opt/servicelib}
      USERVER_SOURCE_DIR: ${USERVER_CONTAINER_SOURCE_DIR:-/opt/userver}
      DEPENDENCY_CONAN_REMOTE_URL: ${DEPENDENCY_CONAN_REMOTE_URL:-}
      DEPENDENCY_CONAN_UPLOAD_URL: ${DEPENDENCY_CONAN_UPLOAD_URL:-}
      DEPENDENCY_CONAN_PUBLISH: ${DEPENDENCY_CONAN_PUBLISH:-0}
      CPPSERVICELIB_CONAN_LOCKFILE: ${CPPSERVICELIB_CONAN_LOCKFILE:-}
      DEPENDENCY_CONAN_CREDENTIAL_FILE: /run/secrets/dependency_conan_credential
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
      PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
      CCACHE_DIR: /ccache
      CCACHE_BASEDIR: /workspace/source
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: ${CCACHE_MAXSIZE:-20G}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GIT_CONFIG_COUNT: ${GIT_CONFIG_COUNT:-0}
      GIT_CONFIG_KEY_0: ${GIT_CONFIG_KEY_0:-}
      GIT_CONFIG_VALUE_0: ${GIT_CONFIG_VALUE_0:-}
      GIT_CONFIG_KEY_1: ${GIT_CONFIG_KEY_1:-}
      GIT_CONFIG_VALUE_1: ${GIT_CONFIG_VALUE_1:-}
      FETCH_CPP_DEPENDENCIES: ${FETCH_CPP_DEPENDENCIES:-OFF}
      ENABLE_OTLP_TRACING: ${ENABLE_OTLP_TRACING:-OFF}
      USERVER_LTO: ${USERVER_LTO:-OFF}
    volumes:
      - .:/workspace/source:ro
      - cpp-cmake-build:/workspace/build
      - cpp-ccache:/ccache
      - ${DEPENDENCY_CONAN_HOME:-cpp-conan2}:/conan
    secrets:
      - dependency_conan_credential
    command:
      - /bin/bash
      - -c
      - source scripts/configure-git-auth.generated.sh && ./scripts/conan-install.generated.sh Debug /workspace/build/conan-debug && conan_toolchain="$(cat /workspace/build/conan-debug/toolchain.path)" && ./scripts/run_with_progress.generated.sh "Debug configure" cmake --fresh --preset docker-debug -DCMAKE_TOOLCHAIN_FILE="$${conan_toolchain}" -DFETCH_CPP_DEPENDENCIES="${FETCH_CPP_DEPENDENCIES:-OFF}" && ./scripts/run_with_progress.generated.sh "Debug build" cmake --build --preset docker-debug && ./scripts/run_with_progress.generated.sh "Test suite" ctest --test-dir /workspace/build --output-on-failure --no-tests=error
  analyticsservice-runtime:
    image: cppexample-analyticsservice:local
    build:
      context: .
      dockerfile: Dockerfile.cmake
      target: runtime-analyticsservice
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        DEPENDENCY_DOCKER_REGISTRY: ${DEPENDENCY_DOCKER_REGISTRY:-docker.io}
        DEPENDENCY_GITHUB_RAW_URL: ${DEPENDENCY_GITHUB_RAW_URL:-}
        DEPENDENCY_APT_UBUNTU_ARCHIVE_URL: ${DEPENDENCY_APT_UBUNTU_ARCHIVE_URL:-}
        DEPENDENCY_APT_UBUNTU_SECURITY_URL: ${DEPENDENCY_APT_UBUNTU_SECURITY_URL:-}
        DEPENDENCY_APT_UBUNTU_PORTS_URL: ${DEPENDENCY_APT_UBUNTU_PORTS_URL:-}
        DEPENDENCY_CONAN_REMOTE_URL: ${DEPENDENCY_CONAN_REMOTE_URL:-}
        DEPENDENCY_CONAN_UPLOAD_URL: ${DEPENDENCY_CONAN_UPLOAD_URL:-}
        DEPENDENCY_CONAN_PUBLISH: ${DEPENDENCY_CONAN_PUBLISH:-0}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        USERVER_LTO: ${USERVER_LTO:-ON}
        RUNTIME_STRIP: ${RUNTIME_STRIP:-ON}
        EXAMPLE_PROFILE: ${EXAMPLE_PROFILE:-function-call}
      additional_contexts:
        servicelib-source: ${SERVICELIB_SOURCE_CONTEXT:-https://github.com/gorundebug/cppservicelib.git#v0.2.72}
        userver-source: ${USERVER_SOURCE_CONTEXT:-https://github.com/userver-framework/userver.git#c9f77729c0edce7e423def2d4a4450aa7fc9d259}
      secrets:
        - dependency_conan_credential
  inventoryservice-runtime:
    image: cppexample-inventoryservice:local
    build:
      context: .
      dockerfile: Dockerfile.cmake
      target: runtime-inventoryservice
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        DEPENDENCY_DOCKER_REGISTRY: ${DEPENDENCY_DOCKER_REGISTRY:-docker.io}
        DEPENDENCY_GITHUB_RAW_URL: ${DEPENDENCY_GITHUB_RAW_URL:-}
        DEPENDENCY_APT_UBUNTU_ARCHIVE_URL: ${DEPENDENCY_APT_UBUNTU_ARCHIVE_URL:-}
        DEPENDENCY_APT_UBUNTU_SECURITY_URL: ${DEPENDENCY_APT_UBUNTU_SECURITY_URL:-}
        DEPENDENCY_APT_UBUNTU_PORTS_URL: ${DEPENDENCY_APT_UBUNTU_PORTS_URL:-}
        DEPENDENCY_CONAN_REMOTE_URL: ${DEPENDENCY_CONAN_REMOTE_URL:-}
        DEPENDENCY_CONAN_UPLOAD_URL: ${DEPENDENCY_CONAN_UPLOAD_URL:-}
        DEPENDENCY_CONAN_PUBLISH: ${DEPENDENCY_CONAN_PUBLISH:-0}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        USERVER_LTO: ${USERVER_LTO:-ON}
        RUNTIME_STRIP: ${RUNTIME_STRIP:-ON}
        EXAMPLE_PROFILE: ${EXAMPLE_PROFILE:-function-call}
      additional_contexts:
        servicelib-source: ${SERVICELIB_SOURCE_CONTEXT:-https://github.com/gorundebug/cppservicelib.git#v0.2.72}
        userver-source: ${USERVER_SOURCE_CONTEXT:-https://github.com/userver-framework/userver.git#c9f77729c0edce7e423def2d4a4450aa7fc9d259}
      secrets:
        - dependency_conan_credential
  orderservice-runtime:
    image: cppexample-orderservice:local
    build:
      context: .
      dockerfile: Dockerfile.cmake
      target: runtime-orderservice
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        DEPENDENCY_DOCKER_REGISTRY: ${DEPENDENCY_DOCKER_REGISTRY:-docker.io}
        DEPENDENCY_GITHUB_RAW_URL: ${DEPENDENCY_GITHUB_RAW_URL:-}
        DEPENDENCY_APT_UBUNTU_ARCHIVE_URL: ${DEPENDENCY_APT_UBUNTU_ARCHIVE_URL:-}
        DEPENDENCY_APT_UBUNTU_SECURITY_URL: ${DEPENDENCY_APT_UBUNTU_SECURITY_URL:-}
        DEPENDENCY_APT_UBUNTU_PORTS_URL: ${DEPENDENCY_APT_UBUNTU_PORTS_URL:-}
        DEPENDENCY_CONAN_REMOTE_URL: ${DEPENDENCY_CONAN_REMOTE_URL:-}
        DEPENDENCY_CONAN_UPLOAD_URL: ${DEPENDENCY_CONAN_UPLOAD_URL:-}
        DEPENDENCY_CONAN_PUBLISH: ${DEPENDENCY_CONAN_PUBLISH:-0}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        USERVER_LTO: ${USERVER_LTO:-ON}
        RUNTIME_STRIP: ${RUNTIME_STRIP:-ON}
        EXAMPLE_PROFILE: ${EXAMPLE_PROFILE:-function-call}
      additional_contexts:
        servicelib-source: ${SERVICELIB_SOURCE_CONTEXT:-https://github.com/gorundebug/cppservicelib.git#v0.2.72}
        userver-source: ${USERVER_SOURCE_CONTEXT:-https://github.com/userver-framework/userver.git#c9f77729c0edce7e423def2d4a4450aa7fc9d259}
      secrets:
        - dependency_conan_credential

volumes:
  cpp-cmake-build:
    name: cppexample_cpp-cmake-build
  cpp-ccache:
    name: cppexample_cpp-ccache
  cpp-conan2:
    external: true
    name: ${DEPENDENCY_CONAN_VOLUME:-dependency-conan2}

secrets:
  dependency_conan_credential:
    file: ${DEPENDENCY_CONAN_CREDENTIAL_FILE:-/dev/null}