services:
  cpp-build:
    image: cppexample-cpp-build
    build:
      context: .
      dockerfile: Dockerfile.cmake
      target: development
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        SERVICEGEN_GITHUB_RAW_URL: ${SERVICEGEN_GITHUB_RAW_URL:-}
        SERVICEGEN_APT_UBUNTU_ARCHIVE_URL: ${SERVICEGEN_APT_UBUNTU_ARCHIVE_URL:-}
        SERVICEGEN_APT_UBUNTU_SECURITY_URL: ${SERVICEGEN_APT_UBUNTU_SECURITY_URL:-}
        SERVICEGEN_APT_UBUNTU_PORTS_URL: ${SERVICEGEN_APT_UBUNTU_PORTS_URL:-}
      additional_contexts:
        servicelib-source: ${SERVICELIB_SOURCE_CONTEXT:-https://github.com/gorundebug/cppservicelib.git#v0.2.7}
        userver-source: ${USERVER_SOURCE_CONTEXT:-https://github.com/userver-framework/userver.git#c9f77729c0edce7e423def2d4a4450aa7fc9d259}
    working_dir: /workspace
    environment:
      SERVICELIB_SOURCE_DIR: ${SERVICELIB_CONTAINER_SOURCE_DIR:-/opt/servicelib}
      USERVER_SOURCE_DIR: ${USERVER_CONTAINER_SOURCE_DIR:-/opt/userver}
      CPM_SOURCE_CACHE: /var/cache/cpm
      CCACHE_DIR: /ccache
      CCACHE_BASEDIR: /workspace
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: ${CCACHE_MAXSIZE:-20G}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      SERVICEGEN_FETCH_CPP_DEPENDENCIES: ${SERVICEGEN_FETCH_CPP_DEPENDENCIES:-OFF}
      SERVICEGEN_ENABLE_OTLP_TRACING: ${SERVICEGEN_ENABLE_OTLP_TRACING:-OFF}
      USERVER_LTO: ${USERVER_LTO:-OFF}
    volumes:
      - .:/workspace
      - cpp-cmake-build:/workspace/build
      - cpp-fetchcontent:/workspace/build/_deps
      - cpp-cpm-source:/var/cache/cpm
      - cpp-ccache:/ccache
    command:
      - /bin/bash
      - -lc
      - source scripts/configure-git-auth.generated.sh && ./scripts/run_with_progress.generated.sh "Debug configure" cmake --preset docker-debug -DSERVICEGEN_FETCH_CPP_DEPENDENCIES="${SERVICEGEN_FETCH_CPP_DEPENDENCIES:-OFF}" && ./scripts/run_with_progress.generated.sh "Debug build" cmake --build --preset docker-debug && ./scripts/run_with_progress.generated.sh "Test suite" ctest --preset docker-debug
  analyticsservice-runtime:
    image: cppexample-analyticsservice
    build:
      context: .
      dockerfile: Dockerfile.cmake
      target: runtime-analyticsservice
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        SERVICEGEN_GITHUB_RAW_URL: ${SERVICEGEN_GITHUB_RAW_URL:-}
        SERVICEGEN_APT_UBUNTU_ARCHIVE_URL: ${SERVICEGEN_APT_UBUNTU_ARCHIVE_URL:-}
        SERVICEGEN_APT_UBUNTU_SECURITY_URL: ${SERVICEGEN_APT_UBUNTU_SECURITY_URL:-}
        SERVICEGEN_APT_UBUNTU_PORTS_URL: ${SERVICEGEN_APT_UBUNTU_PORTS_URL:-}
        USERVER_LTO: ${USERVER_LTO:-ON}
        SERVICEGEN_RUNTIME_STRIP: ${SERVICEGEN_RUNTIME_STRIP:-ON}
        SERVICEGEN_EXAMPLE_PROFILE: ${SERVICEGEN_EXAMPLE_PROFILE:-function-call}
      additional_contexts:
        servicelib-source: ${SERVICELIB_SOURCE_CONTEXT:-https://github.com/gorundebug/cppservicelib.git#v0.2.7}
        userver-source: ${USERVER_SOURCE_CONTEXT:-https://github.com/userver-framework/userver.git#c9f77729c0edce7e423def2d4a4450aa7fc9d259}
  inventoryservice-runtime:
    image: cppexample-inventoryservice
    build:
      context: .
      dockerfile: Dockerfile.cmake
      target: runtime-inventoryservice
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        SERVICEGEN_GITHUB_RAW_URL: ${SERVICEGEN_GITHUB_RAW_URL:-}
        SERVICEGEN_APT_UBUNTU_ARCHIVE_URL: ${SERVICEGEN_APT_UBUNTU_ARCHIVE_URL:-}
        SERVICEGEN_APT_UBUNTU_SECURITY_URL: ${SERVICEGEN_APT_UBUNTU_SECURITY_URL:-}
        SERVICEGEN_APT_UBUNTU_PORTS_URL: ${SERVICEGEN_APT_UBUNTU_PORTS_URL:-}
        USERVER_LTO: ${USERVER_LTO:-ON}
        SERVICEGEN_RUNTIME_STRIP: ${SERVICEGEN_RUNTIME_STRIP:-ON}
        SERVICEGEN_EXAMPLE_PROFILE: ${SERVICEGEN_EXAMPLE_PROFILE:-function-call}
      additional_contexts:
        servicelib-source: ${SERVICELIB_SOURCE_CONTEXT:-https://github.com/gorundebug/cppservicelib.git#v0.2.7}
        userver-source: ${USERVER_SOURCE_CONTEXT:-https://github.com/userver-framework/userver.git#c9f77729c0edce7e423def2d4a4450aa7fc9d259}
  orderservice-runtime:
    image: cppexample-orderservice
    build:
      context: .
      dockerfile: Dockerfile.cmake
      target: runtime-orderservice
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        SERVICEGEN_GITHUB_RAW_URL: ${SERVICEGEN_GITHUB_RAW_URL:-}
        SERVICEGEN_APT_UBUNTU_ARCHIVE_URL: ${SERVICEGEN_APT_UBUNTU_ARCHIVE_URL:-}
        SERVICEGEN_APT_UBUNTU_SECURITY_URL: ${SERVICEGEN_APT_UBUNTU_SECURITY_URL:-}
        SERVICEGEN_APT_UBUNTU_PORTS_URL: ${SERVICEGEN_APT_UBUNTU_PORTS_URL:-}
        USERVER_LTO: ${USERVER_LTO:-ON}
        SERVICEGEN_RUNTIME_STRIP: ${SERVICEGEN_RUNTIME_STRIP:-ON}
        SERVICEGEN_EXAMPLE_PROFILE: ${SERVICEGEN_EXAMPLE_PROFILE:-function-call}
      additional_contexts:
        servicelib-source: ${SERVICELIB_SOURCE_CONTEXT:-https://github.com/gorundebug/cppservicelib.git#v0.2.7}
        userver-source: ${USERVER_SOURCE_CONTEXT:-https://github.com/userver-framework/userver.git#c9f77729c0edce7e423def2d4a4450aa7fc9d259}

volumes:
  cpp-cmake-build:
    name: cppexample_cpp-cmake-build
  cpp-fetchcontent:
    name: cppexample_cpp-fetchcontent
  cpp-cpm-source:
    name: cppexample_cpp-cpm-source
  cpp-ccache:
    name: cppexample_cpp-ccache