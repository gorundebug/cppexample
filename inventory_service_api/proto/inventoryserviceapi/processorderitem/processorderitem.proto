syntax = "proto3";
package processorderitem;

option go_package = "github.com/gorundebug/cppexample-inventory-service-api/pkg/generated/proto/inventoryserviceapi/processorderitem";

message ProcessOrderItemRequest {
  string order_id = 1;
  string item_id = 2;
  string sku = 3;
  int32 quantity = 4;
}

message ProcessOrderItemResponse {
  int32 available_qty = 1;
  bool reserved = 2;
  string status = 3;
}
