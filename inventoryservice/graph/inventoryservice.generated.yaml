dataConnectors:
    inventoryServiceApi:
        address: dns:///localhost:9202
        connectionsCount: 1
        endpoints:
            processOrderItem:
                functionDescription: |
                    Reserve inventory for one order item using its order ID, item ID, SKU, and quantity.
                    Return the available quantity, reservation outcome, and status. The caller combines this response with the original identity, requested quantity, and unit price.
                    If the inventory call fails, the caller returns a non-reserved PROCESSING_ERROR result with the failure message.
                functionInitializerGroup: ""
                functionName: ProcessOrderItem
                functionPackage: ""
                grpcMethodType: NoStreaming
                methodName: ProcessOrderItem
                name: Process Order Item
                publicFunction: false
        goImplementation: google/grpc
        module: inventory_service_api
        name: Inventory Service API
        pythonImplementation: google/grpc
        rustImplementation: rust/tonic
        type: gRPC
        typeScriptImplementation: grpc/grpc-js
pools:
    inventoryPriorityWorkers:
        executorsCount: 2
        name: Inventory Priority Workers
services:
    inventoryService:
        appearance:
            color: '#6800FF'
            pipelines:
                inventoryItem:
                    getInventoryItemData:
                        x: 527
                        "y": -562
                    getInventoryItemError:
                        x: 733
                        "y": -263
                    mergeInventoryResult:
                        x: 542
                        "y": 33
                    processInventoryItem:
                        x: 250
                        "y": -400
        defaultCallSemantics: FunctionCall
        environment: ""
        golangVersion: 1.25.4
        grpcHost: 0.0.0.0
        grpcPort: 9202
        httpHost: 0.0.0.0
        httpPort: 9092
        kubernetesWorkloadType: Deployment
        links:
            link1:
                callSemantics: FunctionCall
                from: getInventoryItemData
                to: mergeInventoryResult
            link2:
                callSemantics: FunctionCall
                from: processInventoryItem
                poolName: Inventory Priority Workers
                priority: 10
                to: getInventoryItemData
        livenessHandler: health/live
        metricsHandler: metrics
        modulePath: github.com/gorundebug/cppexample-inventoryservice
        name: Inventory Service
        pipelines:
            inventoryItem:
                getInventoryItemData:
                    errorStream: getInventoryItemError
                    functionDescription: |
                        Reserve the requested quantity without allowing concurrent orders to overdraw stock.
                        On success, return CONFIRMED with the requested quantity available. Otherwise return OUT_OF_STOCK with the current available quantity.
                        Preserve the order and item identity, requested quantity, and unit price.
                        The example starts with SKU-001: 100, SKU-002: 50, and SKU-003: 25.
                    functionInitializerGroup: ""
                    functionModule: ""
                    functionName: GetInventoryItemData
                    functionPackage: ""
                    name: Get Inventory Item Data
                    source: processInventoryItem
                    type: Process
                    valueType: orderItemResult
                getInventoryItemError:
                    functionDescription: |
                        When inventory processing fails, return an OUT_OF_STOCK result with no available quantity.
                        Preserve the order and item identity and requested quantity, and record the failure.
                    functionInitializerGroup: ""
                    functionModule: ""
                    functionName: GetInventoryItemError
                    functionPackage: ""
                    name: Get Inventory Item Error
                    source: getInventoryItemData
                    type: Error
                    valueType: orderItemResult
                mergeInventoryResult:
                    name: Merge Inventory Result
                    sources:
                        - getInventoryItemData
                        - getInventoryItemError
                    type: Merge
                processInventoryItem:
                    endpoint: processOrderItem
                    name: 'Process Inventory Item '
                    source: mergeInventoryResult
                    type: Input
                    valueType: orderItem
        programmingLanguage: CppUserver
        readinessHandler: health/ready
        shutdownTimeout: 30000
        startupHandler: health/startup
        statusHandler: status
settings:
    moduleVersion: v0.2.12
    name: Example
    repoPath: github.com/gorundebug/cppexample
types:
    orderItem:
        definitionFormat: Native
        description: 'A single line item within an order. Fields: OrderID string, ItemID string, SKU string, Quantity int.'
        module: model
        name: OrderItem
        publicType: false
        transferByValue: false
        type: struct
    orderItemResult:
        definitionFormat: Native
        description: 'Inventory reservation result for a single order item. Fields: OrderID string, ItemID string, SKU string, RequestedQty int, AvailableQty int, Reserved bool, Status string (CONFIRMED / OUT_OF_STOCK / PROCESSING_ERROR), UnitPrice float64, Error string.'
        module: model
        name: OrderItemResult
        publicType: false
        transferByValue: false
        type: struct
