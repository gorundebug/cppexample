services:
  inventoryservice:
    image: inventoryservice-cpp-build
    working_dir: /workspace
    command:
      - /bin/sh
      - -lc
      - |
        if [ "$${DEBUG:-0}" = "1" ]; then
          exec gdbserver :2345 /workspace/build/example_inventory_service --config /workspace/static_config.yaml --config_vars /workspace/config/config_vars.integration.yaml
        fi
        exec /workspace/build/example_inventory_service --config /workspace/static_config.yaml --config_vars /workspace/config/config_vars.integration.yaml
    volumes:
      - .:/workspace
      - cpp-dev-cmake-build:/workspace/build
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE

volumes:
  cpp-dev-cmake-build:
    name: cppexample_inventoryservice_cpp-cmake-build