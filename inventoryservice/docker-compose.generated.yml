services:
  inventoryservice:
    image: cppexample-inventoryservice
    working_dir: /app
    command:
      - --config
      - /app/static_config.yaml
      - --config_vars
      - /app/config/config_vars.integration.yaml
    stop_grace_period: 30000ms
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-0}
    ports:
      - "9092:9092"
      - "9202:9202"
      - "2345:2345"