components_manager:
  task_processors:
    main-task-processor:
      worker_threads: 4
    fs-task-processor:
      worker_threads: 4

  default_task_processor: main-task-processor
  components:
    servicelib-disabled-server-middlewares:
    logging:
      fs-task-processor: fs-task-processor
      loggers:
        default:
          file_path: '@stderr'
          level: info
          overflow_behavior: discard
    testsuite-support:
    server:
      listener:
        port: 9092
        task_processor: main-task-processor
    servicelib-metrics-handler:
      path: /metrics
      method: GET
      task_processor: main-task-processor

    servicelib-status-handler:
      path: /status
      method: GET
      task_processor: main-task-processor
    servicelib-status-data-handler:
      path: /status/data
      method: GET
      task_processor: main-task-processor
    servicelib-status-graph-handler:
      path: /status/graph
      method: GET
      task_processor: main-task-processor
    servicelib-status-js-handler:
      path: /status/vis.min.js
      method: GET
      task_processor: main-task-processor
    servicelib-status-css-handler:
      path: /status/vis.min.css
      method: GET
      task_processor: main-task-processor

    servicelib-startup-handler:
      path: /health/startup
      method: GET
      task_processor: main-task-processor

    servicelib-readiness-handler:
      path: /health/ready
      method: GET
      task_processor: main-task-processor

    servicelib-liveness-handler:
      path: /health/live
      method: GET
      task_processor: main-task-processor



    grpc-server:
      port: 9202
      completion-queue-count: 1
    grpc-server-middlewares-pipeline:
    servicelib-runtime:
      config-path: config/config.yaml
      override-path: $inventoryServiceConfigOverridePath
      fs-task-processor: fs-task-processor
    inventory-service: {}
    inventory-service-api:
      task-processor: main-task-processor
      disable-all-pipeline-middlewares: true