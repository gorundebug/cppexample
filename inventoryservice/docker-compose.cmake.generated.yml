services:
  cpp-build:
    image: inventoryservice-cpp-build
    build:
      context: .
      dockerfile: Dockerfile.cmake
      # The project Dockerfile also contains runtime stages for every service.
      # A packaged service only needs the shared development toolchain here;
      # selecting it explicitly keeps an independent build independent.
      target: development
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        SERVICEGEN_GITHUB_RAW_URL: ${SERVICEGEN_GITHUB_RAW_URL:-}
        SERVICEGEN_APT_UBUNTU_ARCHIVE_URL: ${SERVICEGEN_APT_UBUNTU_ARCHIVE_URL:-}
        SERVICEGEN_APT_UBUNTU_SECURITY_URL: ${SERVICEGEN_APT_UBUNTU_SECURITY_URL:-}
        SERVICEGEN_APT_UBUNTU_PORTS_URL: ${SERVICEGEN_APT_UBUNTU_PORTS_URL:-}
        SERVICEGEN_CONAN_REMOTE_URL: ${SERVICEGEN_CONAN_REMOTE_URL:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
      additional_contexts:
        servicelib-source: ${SERVICELIB_SOURCE_CONTEXT:-https://github.com/gorundebug/cppservicelib.git#v0.2.14}
        userver-source: ${USERVER_SOURCE_CONTEXT:-https://github.com/userver-framework/userver.git#c9f77729c0edce7e423def2d4a4450aa7fc9d259}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /workspace
    environment:
      SERVICELIB_SOURCE_DIR: ${SERVICELIB_CONTAINER_SOURCE_DIR:-/opt/servicelib}
      CPPSERVICELIB_SOURCE_DIR: ${SERVICELIB_CONTAINER_SOURCE_DIR:-/opt/servicelib}
      USERVER_SOURCE_DIR: ${USERVER_CONTAINER_SOURCE_DIR:-/opt/userver}
      SERVICEGEN_CONAN_REMOTE_URL: ${SERVICEGEN_CONAN_REMOTE_URL:-}
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
      PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
      CCACHE_DIR: /ccache
      CCACHE_BASEDIR: /workspace
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: ${CCACHE_MAXSIZE:-20G}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GIT_CONFIG_COUNT: ${GIT_CONFIG_COUNT:-0}
      GIT_CONFIG_KEY_0: ${GIT_CONFIG_KEY_0:-}
      GIT_CONFIG_VALUE_0: ${GIT_CONFIG_VALUE_0:-}
      GIT_CONFIG_KEY_1: ${GIT_CONFIG_KEY_1:-}
      GIT_CONFIG_VALUE_1: ${GIT_CONFIG_VALUE_1:-}
      SERVICEGEN_FETCH_CPP_DEPENDENCIES: ${SERVICEGEN_FETCH_CPP_DEPENDENCIES:-ON}
      USERVER_LTO: ${USERVER_LTO:-OFF}
    volumes:
      - .:/workspace
      - cpp-cmake-build:/workspace/build
      - cpp-ccache:/ccache
      - ${SERVICEGEN_CONAN_HOME:-cpp-conan2}:/conan
    command:
      - /bin/bash
      - -lc
      - source scripts/configure-git-auth.generated.sh && ./scripts/conan-install.generated.sh Debug /workspace/build/conan-debug && conan_toolchain="$(cat /workspace/build/conan-debug/toolchain.path)" && ./scripts/run_with_progress.generated.sh "Debug configure" cmake --fresh --preset docker-debug -DCMAKE_TOOLCHAIN_FILE="$${conan_toolchain}" -DSERVICEGEN_FETCH_CPP_DEPENDENCIES="${SERVICEGEN_FETCH_CPP_DEPENDENCIES:-ON}" && ./scripts/run_with_progress.generated.sh "Debug build" cmake --build --preset docker-debug && ./scripts/run_with_progress.generated.sh "Test suite" ctest --preset docker-debug

volumes:
  cpp-cmake-build:
  cpp-ccache:
  cpp-conan2: