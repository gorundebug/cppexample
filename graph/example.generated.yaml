dataConnectors:
    inventoryServiceApi:
        address: dns:///localhost:9202
        connectionsCount: 1
        endpoints:
            processOrderItem:
                functionDescription: |
                    Reserve inventory for one order item using its order ID, item ID, SKU, and quantity.
                    Return the available quantity, reservation outcome, and status. The caller combines this response with the original identity, requested quantity, and unit price.
                    If the inventory call fails, the caller returns a non-reserved PROCESSING_ERROR result with the failure message.
                functionInitializerGroup: ""
                functionName: ProcessOrderItem
                functionPackage: endpoint
                grpcMethodType: NoStreaming
                methodName: ProcessOrderItem
                name: Process Order Item
                publicFunction: false
        goImplementation: google/grpc
        module: inventory_service_api
        name: Inventory Service API
        pythonImplementation: google/grpc
        rustImplementation: rust/tonic
        type: gRPC
        typeScriptImplementation: grpc/grpc-js
    localCron:
        endpoints:
            analyticsSchedule:
                enabled: true
                functionDescription: |
                    Create an analytics job message identifying the local scheduled firing.
                functionInitializerGroup: ""
                functionName: AnalyticsSchedule
                functionPackage: cron
                missedRunPolicy: FireOnce
                name: Analytics Schedule
                overlapPolicy: Skip
                publicFunction: false
                schedule: '*/5 * * * *'
                timezone: UTC
                tracingEnabled: false
            localSchedule:
                enabled: true
                functionDescription: |
                    Create a job message identifying the local scheduled firing.
                functionInitializerGroup: ""
                functionName: LocalSchedule
                functionPackage: cron
                missedRunPolicy: FireOnce
                name: Local Schedule
                overlapPolicy: Skip
                publicFunction: false
                schedule: '*/5 * * * *'
                timezone: UTC
                tracingEnabled: false
        goImplementation: go/gocron
        name: Local Cron
        pythonImplementation: python/apscheduler
        rustImplementation: rust/croner
        type: Cron
        typeScriptImplementation: node/croner
    orderEvents:
        brokers: redpanda:9092
        dialTimeout: 5000
        endpoints:
            orderProcessed:
                consumerGroup: analytics-service
                createTopic: true
                enabled: true
                functionDescription: |
                    Exchange OrderProcessed events keyed by order ID.
                    Producers include the final status, processing time, total and confirmed item counts, and a failure reason for unsuccessful orders.
                    Consumers decode the event and mark its Kafka message processed only after the pipeline handles it successfully.
                functionInitializerGroup: ""
                functionName: OrderProcessedEndpoint
                functionPackage: endpoint
                name: Order Processed
                partitions: 1
                publicFunction: false
                replicationFactor: 1
                topic: order-processed
        goImplementation: IBM/Sarama
        name: Order Events
        password: ""
        pythonImplementation: aiokafka
        rustImplementation: rust/rdkafka
        saslMechanism: SCRAM-SHA-512
        securityProtocol: PLAINTEXT
        type: Kafka
        typeScriptImplementation: confluent/kafka-javascript
        username: ""
        version: 2.8.0
    orderServiceApi:
        endpoints:
            processOrder:
                functionDescription: |
                    Accept orders with at least one item and positive quantities; reject malformed or invalid requests as client errors.
                    Reuse X-Request-ID when supplied, otherwise generate an order ID. Preserve customer, item, price, and X-Trace data, and apply the configured timeout of five seconds by default.
                    Return one response per order. When all items finish, use CONFIRMED only if every item was reserved; otherwise use PARTIALLY_CONFIRMED. If the deadline wins, return TIMED_OUT with the item results received so far.
                    Calculate the total from processed item prices, falling back to the submitted total when no item result arrived, and include individual item failures in the response.
                functionInitializerGroup: ""
                functionName: ProcessOrder
                functionPackage: endpoint
                httpMethodType: POST
                name: Process Order
                path: /v1/processorder
                publicFunction: false
        goImplementation: net/http
        module: order_service_api
        name: Order Service API
        pythonImplementation: aiohttp
        rustImplementation: rust/axum
        type: HTTP
        typeScriptImplementation: node/http
        useDedicatedListener: false
    temporal:
        address: temporal:7233
        apiKey: ""
        endpoints:
            activityJob:
                activityHeartbeatTimeout: 5000
                activityStartToCloseTimeout: 30000
                enabled: true
                functionDescription: ""
