        kubernetesWorkloadType: Deployment
        links:
            link1:
                callSemantics: FunctionCall
                from: getInventoryItemData
                to: mergeInventoryResult
            link2:
                callSemantics: FunctionCall
                from: processInventoryItem
                poolName: Inventory Priority Workers
                priority: 10
                to: getInventoryItemData
        livenessHandler: health/live
        metricsHandler: metrics
        modulePath: github.com/gorundebug/cppexample-inventoryservice
        name: Inventory Service
        pipelines:
            inventoryItem:
                getInventoryItemData:
                    errorStream: getInventoryItemError
                    functionDescription: |
                        Reserve the requested quantity without allowing concurrent orders to overdraw stock.
                        On success, return CONFIRMED with the requested quantity available. Otherwise return OUT_OF_STOCK with the current available quantity.
                        Preserve the order and item identity, requested quantity, and unit price.
                        The example starts with SKU-001: 100, SKU-002: 50, and SKU-003: 25.
                    functionInitializerGroup: ""
                    functionModule: ""
                    functionName: GetInventoryItemData
                    functionPackage: inventoryItem
                    name: Get Inventory Item Data
                    source: processInventoryItem
                    type: Process
                    valueType: orderItemResult
                getInventoryItemError:
                    functionDescription: |
                        When inventory processing fails, return an OUT_OF_STOCK result with no available quantity.
                        Preserve the order and item identity and requested quantity, and record the failure.
                    functionInitializerGroup: ""
                    functionModule: ""
                    functionName: GetInventoryItemError
                    functionPackage: inventoryItem
                    name: Get Inventory Item Error
                    source: getInventoryItemData
                    type: Error
                    valueType: orderItemResult
                mergeInventoryResult:
                    name: Merge Inventory Result
                    sources:
                        - getInventoryItemData
                        - getInventoryItemError
                    type: Merge
                processInventoryItem:
                    endpoint: processOrderItem
                    name: 'Process Inventory Item '
                    source: mergeInventoryResult
                    type: Input
                    valueType: orderItem
        programmingLanguage: CppUserver
        readinessHandler: health/ready
        shutdownTimeout: 30000
        startupHandler: health/startup
        statusHandler: status
    orderService:
        appearance:
            color: '#FF5C00'
