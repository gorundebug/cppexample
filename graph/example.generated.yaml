            link3:
                callSemantics: FunctionCall
                from: splitPipeline
                to: processOrderItems
            link4:
                callSemantics: FunctionCall
                from: splitPipeline
                to: softDeadline
        livenessHandler: health/live
        metricsHandler: metrics
        modulePath: github.com/gorundebug/cppexample-orderservice
        name: Order Service
        pipelines:
            default:
                processOrderItemError:
                    name: ProcessOrderItemError
                    source: processOrderItem
                    type: Error
                    valueType: orderState
            order:
                mapOrderItemResultToOrderState:
                    functionDescription: |
                        Produce an order result containing one inventory result and preserving its order ID.
                        Mark it CONFIRMED when the item was reserved; otherwise mark it PARTIALLY_CONFIRMED.
                        Record the time when this result is produced.
                    functionInitializerGroup: ""
                    functionModule: ""
                    functionName: MapOrderItemResultToOrderState
                    functionPackage: order
                    name: Map Order Item Result To Order State
                    source: processOrderItem
                    type: Map
                    valueType: orderState
                mapToOrderProcessed:
                    functionDescription: |
                        Create an OrderProcessed event from the final order state.
                        Preserve the order ID, status, and processing time. Count all item results and reserved items; for unsuccessful orders use the final status as the failure reason.
                    functionInitializerGroup: ""
                    functionModule: ""
                    functionName: MapToOrderProcessed
                    functionPackage: order
                    name: MapToOrderProcessed
                    source: splitOrderResult
                    type: Map
                    valueType: orderProcessed
                mapToOrderState:
                    functionDescription: |
                        Produce a TIMED_OUT order result that preserves the order ID and submitted total.
                        Do not add item results at this stage; results received before the timeout are included in the final response.
                    functionInitializerGroup: ""
                    functionModule: ""
                    functionName: MapToOrderState
                    functionPackage: order
                    name: Map to Order State
                    source: softDeadline
                    type: Map
                    valueType: orderState
                mergeResults:
                    name: Merge Results
                    sources:
                        - mapToOrderState
                        - mapOrderItemResultToOrderState
                        - processOrderItemError
                    type: Merge
                processOrder:
                    endpoint: processOrder
                    name: Process Order
                    source: splitOrderResult
                    type: Input
                    valueType: order
                processOrderItem:
                    endpoint: processOrderItem
                    errorStream: processOrderItemError
                    name: Process Order Item
                    source: processOrderItems
                    type: Sink
                    valueType: orderItemResult
                processOrderItems:
                    functionDescription: |
                        Emit every order item independently for inventory processing.
                        Preserve each item's data and assign the parent order ID.
                    functionInitializerGroup: ""
                    functionModule: ""
                    functionName: ProcessOrderItems
                    functionPackage: order
                    name: Process Order Items
                    source: splitPipeline
                    type: FlatMap
                    valueType: orderItem
                publishOrderProcessed:
                    endpoint: orderProcessed
                    name: Publish Order Processed
                    source: mapToOrderProcessed
                    type: Sink
                    valueType: orderProcessed
                softDeadline:
                    duration: 0
                    functionDescription: |
                        Trigger the timeout branch shortly before the request deadline, leaving the configured duration to assemble a response.
                        When no request deadline exists, use the configured duration itself. Never wait past an existing deadline.
                    functionInitializerGroup: ""
                    functionModule: ""
                    functionName: SoftDeadline
                    functionPackage: order
                    name: Soft Deadline
                    source: splitPipeline
                    type: Delay
                splitOrderResult:
                    name: Split Order Result
                    source: mergeResults
                    type: Split
                splitPipeline:
                    name: Split Pipeline
                    source: processOrder
                    type: Split
        programmingLanguage: CppUserver
        readinessHandler: health/ready
        shutdownTimeout: 30000
        startupHandler: health/startup
        statusHandler: status
settings:
    moduleVersion: v0.2.48
    name: Example
    repoPath: github.com/gorundebug/cppexample
types:
    automationJob:
        description: Automation job payload and result.
        module: model
        name: AutomationJob
        publicType: true
        type: string
        useAlias: false
    order:
        definitionFormat: Native
        description: 'E-commerce order submitted by a customer. Fields: ID string, CustomerID string, Items []OrderItem, CreatedAt time.Time.'
        name: Order
        publicType: false
        transferByValue: false
        type: struct
    orderItem:
        definitionFormat: Native
        description: 'A single line item within an order. Fields: OrderID string, ItemID string, SKU string, Quantity int.'
        module: model
        name: OrderItem
        publicType: false
        transferByValue: false
        type: struct
    orderItemResult:
        definitionFormat: Native
        description: 'Inventory reservation result for a single order item. Fields: OrderID string, ItemID string, SKU string, RequestedQty int, AvailableQty int, Reserved bool, Status string (CONFIRMED / OUT_OF_STOCK / PROCESSING_ERROR), UnitPrice float64, Error string.'
        module: model
        name: OrderItemResult
        publicType: false
        transferByValue: false
        type: struct
    orderProcessed:
        definitionFormat: Native
        description: 'Final order-processing event. Fields: OrderID string, Status string, ProcessedAt time.Time, TotalItems int, ConfirmedItems int, FailureReason string.'
        module: model
        name: OrderProcessed
        publicType: false
        transferByValue: false
        type: struct
    orderState:
        definitionFormat: Native
        description: 'Processing result of an order. Fields: OrderID string, Status string (CONFIRMED — all items reserved; PARTIALLY_CONFIRMED — some items out of stock; TIMED_OUT — order timed out), ConfirmedItems []OrderItemResult, TotalAmount float64, ProcessedAt time.Time.'
        name: OrderState
        publicType: false
        transferByValue: false
        type: struct
    unknownType:
        name: UnknownType
        publicType: false
        type: int
        useAlias: false
