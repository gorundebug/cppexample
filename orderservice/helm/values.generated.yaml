# Code generated by servicegen. Override values in values.yaml.
replicaCount: 1
workloadType: Deployment

image:
  repository: registry:5000/cppexample/orderservice
  tag: local
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  httpPort: 9091
  grpcPort: 9201
  temporalSdkMetricsPort: 9464

metrics:
  serviceMonitor:
    enabled: false
    path: /metrics
    interval: 5s
  temporalSdk:
    enabled: false
    path: /metrics
    interval: 5s

annotations: {}
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

serviceAccount:
  name: ""
  automountServiceAccountToken: false

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

probes:
  startup:
    enabled: true
    path: "/health/startup"
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 12
  readiness:
    enabled: true
    path: "/health/ready"
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    enabled: true
    path: "/health/live"
    initialDelaySeconds: 1
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

secretEnvFrom: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []
extraObjects: []

persistence:
  enabled: false
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  size: 1Gi

env:
  ORDER_EVENTS_BROKERS: "redpanda:9093"

args:
  - "--config"
  - "/app/static_config.yaml"
  - "--config_vars"
  - "/app/config/config_vars.integration.yaml"